[package]
version = "110.3.2"
authors = ["PhysX"]

title = "PhysX Tensor API Implementation"
description="PhysX Tensor API Implementation"
repository = ""
keywords = ["omniverse", "kit", "physics", "physx", "tensors"]
category = "simulation"

icon = "data/icon.png"
preview_image = "data/preview.png"
changelog="docs/CHANGELOG.md"
readme  = "docs/README.md"
support_level = "Example"

[package.writeTarget]
kit = true
python = true
usd = true

[dependencies]
"omni.physics.tensors" = { version = "110.3.2", exact = true }
"omni.physx" = { version = "110.3.2", exact = true }

[[native.plugin]]
path = "bin/*.plugin"
recursive = false
