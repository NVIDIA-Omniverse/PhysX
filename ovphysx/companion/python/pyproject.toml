[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovphysx-companion"
dynamic = ["version"]
description = "Optional authoring and tooling helpers for ovphysx"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
usd = ["numpy>=1.24"]

[tool.setuptools.dynamic]
# Single source: ovphysx/VERSION, resolved by ovphysx_companion.__version__.
version = {attr = "ovphysx_companion.__version__"}

[tool.setuptools.packages.find]
include = ["ovphysx_companion*"]
