########################################################################################################################
# Newton USD Schemas
########################################################################################################################

# Newton USD schema definitions for physics attributes.
#
# SWIPAT Dependencies List:
# -------------------------
# Package              | Version | License    | Source
# newton-usd-schemas   | 0.4.1   | Apache-2.0 | PyPI (https://pypi.org)

[[dependency]]
python = "../_build/target-deps/python"
packages = [
    "newton-usd-schemas==0.4.1",
]
target = "../_build/target-deps/newton_prebundle"
platforms = ["*-x86_64", "*-aarch64"]
download_only = false
install_dependencies = false
extra_args = ["--extra-index-url", "https://pypi.nvidia.com"]
