########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]
logging = "warn"
import_optional_configs = ["${root}/repo_tools.toml"]

[repo.folders]
packages = "${root}/_builtpackages"
version_file = "${root}/VERSION"

########################################################################################################################
# Code Formatter (used mainly for legal text check in headers)
########################################################################################################################
[repo_format]
use_current_year_as_end_year = true
license_preamble = '''
SPDX-FileCopyrightText: Copyright (c) {years} NVIDIA CORPORATION & AFFILIATES. All rights reserved.
SPDX-License-Identifier: Apache-2.0
'''
license_text = "" # we use two-line SPDX licenses

[repo_format.cpp]
# oss settings
files.include = [
    "include/**",
    "src/**",
    "tests/**"
]
files.extensions = [".h", ".h.in", ".hpp", ".inl", ".cpp", ".c"]

files.exclude = [
   "include/ovphysx/dlpack/**"  # vendored third-party header (upstream copyright)
]

# enabled_format_types is a WHITELIST: format_text_files() skips any sub-table
# whose name is not listed, so declaring a new type below is not enough to run
# it -- and it fails silently, formatting nothing rather than erroring.
# repo_format ships ["sh", "bat", "ps1", "lua", "toml", "yaml", "rst", "md"].
[repo_format.text_files]
enabled_format_types."++" = ["cmake", "cpp_extra", "pyi"]

# ovruntime is a nested repo with its own repo.toml and its own legal-format CI
# job (lint-ovruntime), and it deliberately skips its vendored packman tooling.
# ovphysx's text-file globs are root-relative, so without these excludes the
# ovphysx format reaches into ovruntime and stamps files ovruntime skips.
# "++" appends to repo_format's shipped list rather than replacing it.
[repo_format.text_files.sh]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.bat]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.ps1]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.lua]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.toml]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.yaml]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.rst]
files.exclude."++" = ["ovruntime/**"]
[repo_format.text_files.md]
files.exclude."++" = ["ovruntime/**"]

# repo_format ships no text_files type for cmake.
# Matching is by include glob, not files.extensions: splitext("CMakeLists.txt")
# is ".txt", so an extension list would also sweep LICENSE.txt.
[repo_format.text_files.cmake]
comment_chars = "#"
files.include = [
    "**/*.cmake",
    "**/*.cmake.in",
    "**/*.cmake.default",
    "**/CMakeLists.txt",
]
files.exclude = ["_build/**", "_repo/**", "**/_repo/**", "ovruntime/**", "tools/packman/**"]

# CUDA is absent from [repo_format.cpp]'s extension list, and configure-time
# templates never match it either: splitext("version.h.in") is ".in", so the
# ".h.in" entry there is dead config and version.h.in was never stamped.
[repo_format.text_files.cpp_extra]
comment_chars = "//"
files.include = [
    "**/*.cu",
    "**/*.cuh",
    "**/*.h.in",
    "**/*.rc.in",
]
files.exclude = ["_build/**", "_repo/**", "**/_repo/**", "ovruntime/**"]

# .pyi is not in [repo_format.python]'s extension list (".py" only).
[repo_format.text_files.pyi]
comment_chars = "#"
files.include = ["**/*.pyi"]
files.exclude = ["_build/**", "_repo/**", "**/_repo/**", "ovruntime/**"]

[repo_format.python]
maintain_legal_blurbs = true
# oss settings
files.include = [
    "python/**",
    "tensorapi/**",
    "tests/**",
    "docs/**",
    "scripts/**",
    "tools/**",
    "build.sh",
    "repo.sh",
    "scripts/*.sh",
]
files.exclude = [
    # Vendored bootstrap tooling - upstream copyright, not ours to stamp.
    "tools/packman/**",
    "tools/repoman/**",
]

