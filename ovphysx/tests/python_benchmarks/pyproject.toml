[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovphysx-python-benchmarks"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
  "physx-usd-schemas>=25.11.2",
  "pytest>=7",
  "pytest-benchmark>=4",
  "numpy>=1.20",
  "ovphysx",
  "newton-usd-schemas>=0.4.1",
  # The version comes from ovphysx; declare the package to select its index.
  "ovstage",
]

[project.optional-dependencies]
# Optional GPU-side helpers for DLPack roundtrip benchmarks.
gpu = [
  "torch>=2.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["."]
# The suite uses bench_*.py rather than the pytest default test_*.py;
# match both so pytest's auto-discovery picks up bench files.
python_files = ["bench_*.py", "test_*.py"]

# Resolve OVStage from its explicit index with hashes in uv.lock (ADR-0033).

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "ovstage"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "physx-usd-schemas"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
"ovphysx" = { path = "../../python", editable = true }
ovstage = { index = "ovstage" }
physx-usd-schemas = { index = "physx-usd-schemas" }
