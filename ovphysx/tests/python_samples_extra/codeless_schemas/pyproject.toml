[project]
name = "ovphysx-codeless-schemas-sample"
version = "0.0.1"
requires-python = ">=3.10"
# ovphysx is intentionally NOT listed as a PyPI dependency: the regression test
# runs against the locally built ovphysx wheel (installed separately by the
# sample test harness), so it always exercises the schemas shipped by the
# version under test rather than a release pulled from PyPI. Only the stock
# OpenUSD runtime is fetched from PyPI.
dependencies = [
  # usd-core has no linux-aarch64 wheel on PyPI, so exclude that platform; the
  # sample skips itself there (see register_codeless_schemas.py). Wheels exist
  # for linux x86_64, macOS (universal2), and Windows.
  "usd-core; platform_machine != 'aarch64'",
]
